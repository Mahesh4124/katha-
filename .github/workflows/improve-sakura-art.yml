name: Improve Sakura Mountain cinematic artwork

on:
  push:
    branches:
      - frontend/cinematic-reader-20261117
    paths:
      - .github/workflows/improve-sakura-art.yml

permissions:
  contents: write

jobs:
  replace-sakura-scene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download licensed full-resolution twilight mountain photo
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 90 'https://images.pexels.com/photos/37438079/pexels-photo-37438079/free-photo-of-serene-view-of-mount-fuji-with-cherry-blossoms.jpeg?auto=compress&cs=tinysrgb&w=8000' -o /tmp/sakura-full.jpg || \
            curl --fail --location --silent --show-error --retry 3 --max-time 90 'https://images.pexels.com/photos/37438079/pexels-photo-37438079.jpeg?auto=compress&cs=tinysrgb&w=8000' -o /tmp/sakura-full.jpg
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          im = ImageOps.exif_transpose(Image.open('/tmp/sakura-full.jpg')).convert('RGB')
          print('Source resolution:', im.size)
          if min(im.size) < 3600:
              raise RuntimeError('Source is not sufficiently high-resolution for Katha cinematic world')
          portrait = ImageOps.fit(im, (2160, 3840), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
          portrait.save('public/worlds/sakura.webp', 'WEBP', quality=87, method=6)
          print('Scene final size:', portrait.size)
          PY
      - name: Commit tested local asset to feature branch only
        shell: bash
        run: |
          git add public/worlds/sakura.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use genuine high-res twilight Fuji and Sakura photography" || exit 0
          git push origin HEAD:frontend/cinematic-reader-20261117
