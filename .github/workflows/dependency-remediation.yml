name: Review-safe dependency remediation

on:
  push:
    branches:
      - hardening/dependency-remediation-20261117
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install original lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Apply only compatible security updates
        shell: bash
        run: |
          set +e
          bun audit fix --ignore-scripts > /tmp/katha-audit-fix.txt 2>&1
          result=$?
          set -e
          cat /tmp/katha-audit-fix.txt
          echo "bun audit fix exit: $result (remaining advisories may produce 1)"
      - name: Check updated lockfile consistency
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Logic lint
        run: >-
          bunx eslint src --rule 'prettier/prettier: off'
      - name: Regression tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Report remaining production advisories
        shell: bash
        run: |
          bun audit --prod || true
      - name: Commit only verified manifest and lockfile changes
        shell: bash
        run: |
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No compatible dependency fixes available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply compatible dependency security patches"
          git push origin HEAD:hardening/dependency-remediation-20261117
