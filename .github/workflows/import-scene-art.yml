name: Import cinematic scene artwork

on:
  push:
    branches:
      - frontend/cinematic-reader-20261117
    paths:
      - .github/workflows/import-scene-art.yml

permissions:
  contents: write

jobs:
  import-scene-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source artwork and optimize for mobile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          mkdir -p public/worlds /tmp/katha-worlds
          curl -fLsS --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3FwSbWxI5jMoocVvoDFn1WEdLxM/ddc93a99-afaa-42cd-8a1c-bf02a35539db.png" -o /tmp/katha-worlds/night.png
          curl -fLsS --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3FwSbWxI5jMoocVvoDFn1WEdLxM/e4428128-9886-4070-ade9-d5a43e94198c.png" -o /tmp/katha-worlds/day.png
          curl -fLsS --retry 3 "https://images.unsplash.com/photo-1525635569544-610f9540664a?auto=format&fit=crop&w=3000&q=92" -o /tmp/katha-worlds/sakura.jpg
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          for name, src in [('lotus-night','night.png'),('lotus-day','day.png'),('sakura','sakura.jpg')]:
              im = Image.open(Path('/tmp/katha-worlds') / src)
              im = ImageOps.exif_transpose(im).convert('RGB')
              assert im.width >= 900 and im.height >= 1000, (name, im.size)
              im.save(Path('public/worlds') / (name + '.webp'), 'WEBP', quality=89, method=6)
              print(name, im.size, (Path('public/worlds') / (name + '.webp')).stat().st_size)
          PY
      - name: Commit static scene assets to feature branch
        shell: bash
        run: |
          git add public/worlds/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add optimized cinematic scene assets" || exit 0
          git push origin HEAD:frontend/cinematic-reader-20261117
