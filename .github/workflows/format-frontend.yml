name: Normalize Katha frontend on review branch

on:
  push:
    branches:
      - frontend/cinematic-reader-20261117
    paths:
      - .github/workflows/format-frontend.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Normalize source with project formatting rules
        run: bunx prettier --write src
      - name: Verify TypeScript
        run: bunx tsc --noEmit
      - name: Verify unit tests
        run: bun run test
      - name: Verify production build
        run: bun run build
      - name: Commit verified formatting to review branch
        run: |
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize cinematic frontend formatting"
          git push origin HEAD:frontend/cinematic-reader-20261117
