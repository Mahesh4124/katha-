name: Zod major-version compatibility gate

on:
  push:
    branches:
      - hardening/dependency-remediation-20261117
    paths:
      - .github/workflows/zod-compatibility.yml

permissions:
  contents: write

jobs:
  zod-major-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Upgrade direct Zod to patched v4 in isolated branch
        run: bun add 'zod@^4.6.6' --ignore-scripts
      - name: Verify manifest lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Require clean production dependency audit
        run: bun audit --prod
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Verify full ESLint
        run: bunx eslint src
      - name: Verify formatting
        run: bunx prettier --check src
      - name: Regression tests
        run: bun run test
      - name: Production build
        run: bun run build
      - name: Commit only tested upgrades to review branch
        run: |
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Upgrade Zod to patched v4 after full compatibility checks"
          git push origin HEAD:hardening/dependency-remediation-20261117
