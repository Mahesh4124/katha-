name: Katha checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript types
        run: bunx tsc --noEmit
      - name: Check code correctness (formatting tracked separately)
        run: bunx eslint src --rule 'prettier/prettier: off'
      - name: Run regression tests
        run: bun run test
      - name: Build application
        run: bun run build
