name: Prepare Motion dependency for cinematic reader
on:
  push:
    branches:
      - frontend/kinetic-book-mockup-parity-20261117
    paths:
      - .github/workflows/prepare-cinematic-motion.yml
permissions:
  contents: write
jobs:
  prepare-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install existing locked dependencies
        run: bun install --frozen-lockfile
      - name: Add production-grade MIT licensed animation engine
        run: bun add 'motion@^14.12.0' --ignore-scripts
      - name: Check lockfile and dependency security
        run: |
          bun install --frozen-lockfile
          bun audit --prod
      - name: Commit dependency update only to review branch
        run: |
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Motion for professional kinetic book transitions"
          git push origin HEAD:frontend/kinetic-book-mockup-parity-20261117
